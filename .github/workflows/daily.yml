name: Daily QQQ Options File

on:
  schedule:
    # 4:30 PM New York during daylight-saving time
    # Monday through Friday
    - cron: "30 20 * * 1-5"

  workflow_dispatch:

jobs:
  collect-file:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QQQ options collector
        run: python main.py

      - name: Keep Parquet file in GitHub
        uses: actions/upload-artifact@v4
        with:
          name: qqq-options-${{ github.run_number }}
          path: output/options_snapshot_*.parquet
          if-no-files-found: error
          retention-days: 90
